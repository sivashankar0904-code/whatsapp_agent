services:
  whatsapp-agent:
    build: .
    # A linked device permits one connection; a second instance corrupts the
    # shared Signal session state. Never scale this above 1.
    deploy:
      replicas: 1
    restart: unless-stopped
    # Published to the host like the other services in this stack (postgres,
    # redis, minio), so the read-only API can be hit directly, e.g. from Bruno.
    ports:
      - "8081:8081"
    # Reads the same .env the binary uses when run directly on the host, so
    # there is one place for these values instead of two naming conventions.
    env_file: .env
    environment:
      # .env has DB_HOST/WA_S3_ENDPOINT pointed at 127.0.0.1, which is only
      # reachable from the host, not from inside this container. Override both
      # to the docker network service names, read from the _DOCKER-suffixed
      # variables in .env; these entries replace the plain-named ones the
      # env_file above already loaded.
      DB_HOST: ${DB_HOST_DOCKER}
      WA_S3_ENDPOINT: ${WA_S3_ENDPOINT_DOCKER}
    # The process keeps no state on disk; all of it lives in Postgres.
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Pairing needs the QR on stdout, and `docker attach` needs a TTY for it to
    # render as blocks.
    tty: true
    networks: [local]

networks:
  local:
    external: true
